version = 1
project = "demo"

[defaults]
working_dir = "."
restart = "on-failure"
stop_timeout = "10s"
log_max_size = "100MiB"
log_max_files = 10
metrics_interval = "1s"

[[processes]]
name = "api"
command = "go"
args = ["run", "./examples/api", "--port", "8080", "--interval", "3s"]
autostart = true
restart = "always"

[processes.env]
APP_ENV = "development"

[[processes]]
name = "one-task"
command = "go"
args = ["run", "./examples/one-task", "--iterations", "5", "--interval", "500ms"]
autostart = false
restart = "never"

[[schedules]]
name = "nightly-job"
cron = "0 2 * * *"
timezone = "Asia/Taipei"
action = "run"
command = "go"
args = ["run", "./examples/one-task", "--iterations", "3", "--interval", "300ms"]
concurrency = "forbid"

[[schedules]]
name = "refresh-api"
cron = "*/30 * * * *"
timezone = "Asia/Taipei"
action = "restart"
target = "api"
