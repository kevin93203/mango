name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run tests
        run: go test ./...

      - name: Build CLI and daemon
        run: |
          go build ./cmd/mango
          go build ./cmd/mangod

      - name: Initialize and validate a standalone example
        run: |
          go run ./cmd/mango init .ci/mango.yaml
          go run ./cmd/mango config validate .ci/mango.yaml
          go run .ci/examples/tasks/emit.go --steps 1 --delay 1ms
