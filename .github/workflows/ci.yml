name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Go and Rust
        shell: bash
        run: bash scripts/verify.sh

      - name: Upload native release binaries
        uses: actions/upload-artifact@v4
        with:
          name: mango-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            mango
            mango.exe
            mangod
            mangod.exe
            mango-shim/target/release/mango-shim
            mango-shim/target/release/mango-shim.exe

      - name: Initialize and validate a standalone example
        shell: bash
        run: |
          mango_bin=./mango
          if [ "$RUNNER_OS" = "Windows" ]; then mango_bin=./mango.exe; fi
          "$mango_bin" init .ci/mango.yaml
          "$mango_bin" daemon start
          "$mango_bin" config validate .ci/mango.yaml
          go run .ci/examples/tasks/emit.go --steps 1 --delay 1ms
