version: 4
name: demo

defaults:
  working_dir: .
  restart: on-failure
  environment:
    APP_ENV: development

services:
  api:
    command: go
    args: [run, ./examples/api/main.go, --port, "8080"]
    autostart: true
    healthcheck:
      test: [HTTP, http://127.0.0.1:8080/]

tasks:
  backup:
    command: go
    args: [run, ./examples/tasks/emit.go, --steps, "1"]

schedules:
  - name: nightly-backup
    cron: "0 2 * * *"
    timezone: Asia/Taipei
    run: task/backup
