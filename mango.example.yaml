version: 3

defaults:
  working_dir: "."
  supervisor: legacy
  restart: on-failure
  stop_timeout: 10s
  log_max_size: 100MiB
  log_max_files: 10
  metrics_interval: 1s

services:
  api-single:
    command: go
    args:
      - run
      - ./examples/api/main.go
      - --port
      - "8080"
      - --interval
      - 3s
    autostart: true
    restart: always
    environment:
      APP_ENV: development
    healthcheck:
      test: [CMD, curl, -f, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 3s

  api-supervisor:
    command: go
    args:
      - run
      - ./examples/api/main.go
      - --supervise
      - --port
      - "9000"
      - --port
      - "9090"
      - --interval
      - 3s
    autostart: true
    restart: always
    environment:
      APP_ENV: development
    healthcheck:
      policy: all
      interval: 10s
      timeout: 2s
      retries: 3
      checks:
        - test: [CMD, curl, -f, "http://127.0.0.1:9000/"]
        - test: [CMD, curl, -f, "http://127.0.0.1:9090/"]

  one-task:
    command: go
    args:
      - run
      - ./examples/one-task/main.go
      - --iterations
      - "5"
      - --interval
      - 500ms
    autostart: false
    restart: never

tasks:
  nightly-job:
    command: go
    args:
      - run
      - ./examples/one-task/main.go
      - --iterations
      - "3"
      - --interval
      - 300ms
    timeout: 5m
    concurrency: forbid
    retry:
      retries: 3
      delay: 5s

  demo-prepare:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-prepare
      - --steps
      - "2"
      - --delay
      - 200ms
    timeout: 30s
    concurrency: forbid

  demo-extract:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-extract
      - --steps
      - "3"
      - --delay
      - 200ms
    timeout: 30s
    concurrency: allow

  demo-transform:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-transform
      - --steps
      - "3"
      - --delay
      - 250ms
    timeout: 30s
    concurrency: allow

  demo-load:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-load
      - --steps
      - "1"
      - --delay
      - 1s
    timeout: 30s
    concurrency: forbid

  demo-branch-a:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-branch-a
      - --steps
      - "4"
      - --delay
      - 150ms
    timeout: 30s
    concurrency: allow

  demo-branch-b:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-branch-b
      - --steps
      - "4"
      - --delay
      - 150ms
    timeout: 30s
    concurrency: allow

  demo-merge:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-merge
      - --steps
      - "1"
      - --delay
      - 1s
    timeout: 30s

  demo-retry-failure:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-retry-failure
      - --steps
      - "1"
      - --delay
      - 1ms
      - --fail
    timeout: 10s
    concurrency: forbid
    retry:
      retries: 2
      delay: 1s

  demo-independent:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-independent
      - --steps
      - "2"
      - --delay
      - 200ms
    timeout: 30s
    concurrency: allow

  demo-slow-timeout:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-slow-timeout
      - --steps
      - "1"
      - --delay
      - 10s
    timeout: 2s
    concurrency: forbid
    retry:
      retries: 1
      delay: 500ms

  demo-direct:
    command: go
    args:
      - run
      - ./examples/tasks/emit.go
      - --name
      - demo-direct
      - --steps
      - "2"
      - --delay
      - 100ms
    timeout: 30s
    concurrency: allow

  demo-artifact:
    command: go
    args:
      - run
      - ./examples/tasks/artifact/main.go
      - --name
      - demo-artifact
      - --output
      - examples/artifacts/demo-artifact.txt
    timeout: 30s
    concurrency: forbid
    outputs:
      - examples/artifacts/demo-artifact.txt

  execution-demo-task:
    command: go
    args:
      - run
      - ./examples/execution/main.go
      - --name
      - execution-demo-task
      - --duration
      - 20s
      - --interval
      - 1s
    timeout: 1m
    concurrency: forbid

  execution-demo-workflow-a:
    command: go
    args:
      - run
      - ./examples/execution/main.go
      - --name
      - execution-demo-workflow-a
      - --duration
      - 20s
      - --interval
      - 1s
    timeout: 1m
    concurrency: allow

  execution-demo-workflow-b:
    command: go
    args:
      - run
      - ./examples/execution/main.go
      - --name
      - execution-demo-workflow-b
      - --duration
      - 20s
      - --interval
      - 1s
    timeout: 1m
    concurrency: allow

workflows:
  nightly-pipeline:
    concurrency: forbid
    tasks:
      run-nightly-job:
        uses: nightly-job

  demo-linear:
    concurrency: forbid
    tasks:
      prepare:
        uses: demo-prepare
      extract:
        uses: demo-extract
        needs: [prepare]
      transform:
        uses: demo-transform
        needs: [extract]
      load:
        uses: demo-load
        needs: [transform]

  demo-parallel:
    concurrency: allow
    tasks:
      prepare:
        uses: demo-prepare
      branch-a:
        uses: demo-branch-a
        needs: [prepare]
      branch-b:
        uses: demo-branch-b
        needs: [prepare]
      merge:
        uses: demo-merge
        needs: [branch-a, branch-b]

  demo-failure:
    concurrency: forbid
    tasks:
      retry:
        uses: demo-retry-failure
      independent:
        uses: demo-independent
      blocked:
        uses: demo-load
        needs: [retry]
      fan-in:
        uses: demo-merge
        needs: [blocked, independent]

  demo-timeout:
    concurrency: forbid
    tasks:
      slow:
        uses: demo-slow-timeout

  execution-demo-workflow:
    concurrency: forbid
    tasks:
      first:
        uses: execution-demo-workflow-a
      second:
        uses: execution-demo-workflow-b

schedules:
  - name: nightly-job
    cron: "0 2 * * *"
    timezone: Asia/Taipei
    target_type: workflow
    target: nightly-pipeline

  - name: manual-one-task
    cron: "0 * * * *"
    timezone: Asia/Taipei
    target_type: task
    target: nightly-job

  - name: demo-linear-every-5m
    cron: "*/5 * * * *"
    timezone: Asia/Taipei
    target_type: workflow
    target: demo-linear
    misfire: catch_up
    max_catch_up: 2

  - name: demo-parallel-every-10m
    cron: "*/10 * * * *"
    timezone: Asia/Taipei
    target_type: workflow
    target: demo-parallel

  - name: demo-failure-every-15m
    cron: "*/15 * * * *"
    timezone: Asia/Taipei
    target_type: workflow
    target: demo-failure

  - name: demo-timeout-every-20m
    cron: "*/20 * * * *"
    timezone: Asia/Taipei
    target_type: workflow
    target: demo-timeout

  - name: demo-direct-task-every-30m
    cron: "*/30 * * * *"
    timezone: Asia/Taipei
    target_type: task
    target: demo-direct

webhooks:
  - name: demo-linear-hook
    path: /hooks/demo-linear
    target_type: workflow
    target: demo-linear
    secret_ref: env:MANGO_WEBHOOK_SECRET
